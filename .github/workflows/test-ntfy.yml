name: ntfy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ntfy Testnachricht senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: Immobilien-Monitor TEST" \
            -H "Priority: high" \
            -H "Tags: house,white_check_mark" \
            -d "Der Immobilien-Monitor funktioniert! 🏠" \
            "https://ntfy.sh/${NTFY_TOPIC}"
